[package]
name = "framework"
description = "Nova: the framekernel's trusted framework, the only bridge from MI services to the hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
libkern = { workspace = true }
mdi = { workspace = true }
sys = { workspace = true }

# One line per supported architecture. This is the only place in the
# kernel where an architecture is selected.
[target.'cfg(target_arch = "x86_64")'.dependencies]
amd64 = { workspace = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv64 = { workspace = true }

[lints]
workspace = true
